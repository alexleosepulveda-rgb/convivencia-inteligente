<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Financiero de Morosidad</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); max-width: 1100px; margin: auto; }
        h2 { color: #2c3e50; margin-bottom: 25px; font-weight: 600; }
        .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; background: #fafbfc; padding: 20px; border-radius: 8px; border: 1px solid #e1e4e8; }
        .filter-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; color: #4a5568; font-size: 14px; }
        select { padding: 10px; border-radius: 6px; border: 1px solid #cbd5e0; font-size: 14px; background: white; outline: none; transition: border 0.2s; }
        select:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); }

        /* Panel de leyenda interactiva por checkboxes */
        .legend-panel { background: #fafbfc; padding: 15px 20px; border-radius: 8px; border: 1px solid #e1e4e8; margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
        .legend-title { font-weight: 600; color: #4a5568; font-size: 14px; margin-right: 10px; }
        .legend-item { display: flex; align-items: center; cursor: pointer; font-size: 14px; user-select: none; font-weight: 500; color: #2d3748; }
        .legend-item input { margin-right: 8px; width: 16px; height: 16px; cursor: pointer; }
        .color-box { width: 14px; height: 14px; border-radius: 3px; display: inline-block; margin-right: 6px; }
    </style>
</head>

    function construirPanelLeyenda() {
        const panel = document.getElementById('legendPanel');
        // Mantener el título y recrear los items
        panel.innerHTML = '<span class="legend-title">Tramos de Morosidad:</span>';

        tramosUnicos.forEach(tramo => {
            let label = document.createElement('label');
            label.className = 'legend-item';

            let checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = tramosVisibles[tramo];
            checkbox.onchange = function() {
                tramosVisibles[tramo] = this.checked;
                actualizarGrafico();
            };

            let colorBox = document.createElement('span');
            colorBox.className = 'color-box';
            colorBox.style.backgroundColor = colorMap[tramo];

            let text = document.createTextNode(tramo);

            label.appendChild(checkbox);
            label.appendChild(colorBox);
            label.appendChild(text);
            panel.appendChild(label);

    function inicializar() {

    function actualizarNiveles() {
        const cicloSel = document.getElementById('selectCiclo').value;
        const selNivel = document.getElementById('selectNivel');

        selNivel.innerHTML = '<option value="TODOS">-- Todos los niveles de este ciclo --</option>';

        if (jerarquiaDatos[cicloSel] && jerarquiaDatos[cicloSel].consolidado_niveles) {
            for (let nivel in jerarquiaDatos[cicloSel].consolidado_niveles) {
                let opt = document.createElement('option');
                opt.value = nivel;
                opt.textContent = nivel;

            }
        }

    function actualizarGrafico() {
        const cicloSel = document.getElementById('selectCiclo').value;
        const nivelSel = document.getElementById('selectNivel').value;

        let xEtiquetas = [];
        let tituloSub = "";
        let cursosDatos = {}; 

        // Filtrar solo los tramos que están seleccionados en el panel
        let tramosActivos = tramosUnicos.filter(tramo => tramosVisibles[tramo]);

        if (nivelSel === "TODOS") {
            xEtiquetas = Object.keys(jerarquiaDatos[cicloSel].consolidado_niveles || {});
            xEtiquetas.forEach(niv => {
                let tramosObj = jerarquiaDatos[cicloSel].consolidado_niveles[niv];
                let lista = [];
                tramosActivos.forEach(tramo => {
                    let val = tramosObj[tramo] || 0;
                    if (val > 0) { // Opcional: considerar solo valores > 0 o incluir todos los activos
                        lista.push({ tramo: tramo, valor: val });
                    }
                });
                // Ordenamiento estricto descendente entre los tramos activos restantes de este curso
                lista.sort((a, b) => b.valor - a.valor);
                cursosDatos[niv] = lista;
            });
            tituloSub = `Vista General - ${cicloSel}`;
        } else {
            let seccionesObj = jerarquiaDatos[cicloSel].por_nivel[nivelSel] || {};
            xEtiquetas = Object.keys(seccionesObj);

            // Ordenar cursos por la suma total de los tramos ACTIVOS seleccionados
            let totalesCursos = xEtiquetas.map(curso => {
                let tramosObj = seccionesObj[curso];
                let sum = tramosActivos.reduce((acc, tramo) => acc + (tramosObj[tramo] || 0), 0);
                return { curso, sum };
            });
            totalesCursos.sort((a, b) => b.sum - a.sum);
            xEtiquetas = totalesCursos.map(item => item.curso);

            xEtiquetas.forEach(curso => {
                let tramosObj = seccionesObj[curso];
                let lista = [];
                tramosActivos.forEach(tramo => {
                    let val = tramosObj[tramo] || 0;
                    lista.push({ tramo: tramo, valor: val });
                });
                // Ordenamiento estricto descendente entre los tramos activos restantes de este curso
                lista.sort((a, b) => b.valor - a.valor);
                cursosDatos[curso] = lista;
            });
            tituloSub = `Desglose de Secciones - Nivel: ${nivelSel} (${cicloSel})`;
        }

        // Determinar cuántas barras máximas tendrá un grupo (según la cantidad de tramos activos con datos)
        let maxTramosActivos = 0;
        xEtiquetas.forEach(cat => {
            if (cursosDatos[cat].length > maxTramosActivos) {
                maxTramosActivos = cursosDatos[cat].length;
            }
        });

        let data = [];

        // Construir las trazas para cada posición dinámica de barra
        for (let i = 0; i < maxTramosActivos; i++) {
            let yValues = [];
            let hoverTexts = [];
            let markerColors = [];
            let legendNames = [];

            xEtiquetas.forEach(cat => {
                let arrTramos = cursosDatos[cat];
                if (arrTramos && arrTramos[i]) {
                    let item = arrTramos[i];
                    yValues.push(item.valor);
                    markerColors.push(colorMap[item.tramo]);
                    hoverTexts.push(`<b>${cat}</b><br>Tramo: ${item.tramo}<br>Monto: $${item.valor.toLocaleString('es-CL', {maximumFractionDigits: 0})}`);
                } else {
                    yValues.push(0);
                    markerColors.push('transparent');
                    hoverTexts.push('');
                }
            });

            data.push({
                x: xEtiquetas,
                y: yValues,
                type: 'bar',
                marker: { color: markerColors },
                hoverinfo: 'text',
                hovertext: hoverTexts,
                showlegend: false
            });
        }

        let shapes = [];
        for (let i = 0; i < xEtiquetas.length - 1; i++) {
            shapes.push({
                type: 'line',
                x0: i + 0.5,
                x1: i + 0.5,
                y0: 0,
                y1: 1,
                yref: 'paper',
                line: { color: '#cbd5e0', width: 1.5, dash: 'dash' }
            });
        }

        let layout = {
            title: { text: `Deuda por Morosidad - ${tituloSub}`, font: { size: 18, color: '#2c3e50' } },
            barmode: 'group',
            bargap: 0.22,
            bargroupgap: 0.05,
            xaxis: { title: '<b>Cursos / Niveles</b>', tickangle: 0, gridcolor: '#edf2f7', zeroline: false },
            yaxis: { 
                title: { text: '<b>Saldos Totales ($)</b>', standoff: 20 }, 
                tickformat: ',.0f', 
                gridcolor: '#edf2f7', 
                zeroline: false 
            },
            plot_bgcolor: '#fafbfc',
            paper_bgcolor: '#ffffff',
            shapes: shapes,
            margin: { t: 60, b: 70, l: 100, r: 40 }
        };

        Plotly.newPlot('grafico', data, layout, {responsive: true});
    }

    window.onload = inicializar;
</script>
</body>
</html>
